hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: null
      consider_prior: true
      prior_weight: 1.0
      consider_magic_clip: true
      consider_endpoints: false
      n_startup_trials: 10
      n_ei_candidates: 24
      multivariate: false
      warn_independent_sampling: true
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: maximize
    storage: null
    study_name: tune_simulation
    n_trials: 300
    n_jobs: 1
    search_space: null
    params:
      generation.cicada_ratio: choice(0.3, 0.6, 0.9)
      generation.cicadas.popsize.min: choice(1, 5)
      generation.cicadas.popsize.max: choice(5, 10, 20, 30)
      generation.cicadas.distance.min: choice(30, 60, 90)
      generation.cicadas.distance.max: choice(120, 150, 180)
      generation.others.weights.birds: choice(0.1, 0.5, 1.0)
      generation.others.weights.esc50: choice(0.1, 0.5, 1.0)
      generation.others.weights.insects: choice(0.1, 0.5, 1.0)
      generation.others.popsize.min: choice(0, 5)
      generation.others.popsize.max: choice(5, 10, 20, 30)
      generation.others.distance.min: choice(10, 30, 50, 70)
      generation.others.distance.max: choice(80, 120, 160)
    custom_search_space: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - generation.cicada_ratio=0.9
    - generation.cicadas.popsize.min=5
    - generation.cicadas.popsize.max=5
    - generation.cicadas.distance.min=60
    - generation.cicadas.distance.max=120
    - generation.others.weights.birds=0.1
    - generation.others.weights.esc50=0.1
    - generation.others.weights.insects=0.1
    - generation.others.popsize.min=0
    - generation.others.popsize.max=5
    - generation.others.distance.min=10
    - generation.others.distance.max=120
  job:
    name: run
    chdir: null
    override_dirname: generation.cicada_ratio=0.9,generation.cicadas.distance.max=120,generation.cicadas.distance.min=60,generation.cicadas.popsize.max=5,generation.cicadas.popsize.min=5,generation.others.distance.max=120,generation.others.distance.min=10,generation.others.popsize.max=5,generation.others.popsize.min=0,generation.others.weights.birds=0.1,generation.others.weights.esc50=0.1,generation.others.weights.insects=0.1
    id: '3'
    num: 3
    config_name: tune_simulation_tpe.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/okamoto/CicadaChorusDetection
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/okamoto/CicadaChorusDetection/step3_model_training/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/okamoto/CicadaChorusDetection/multirun/2025-03-12/09-35-01/3
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: optuna
      hydra/sweeper/sampler: tpe
      hydra/launcher: basic
      hydra/output: default
  verbose: false
